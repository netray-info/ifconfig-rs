name: Audit

# Advisory scans run on a schedule and on demand only — never on push or PR.
# A new RUSTSEC entry in a transitive dep should not block unrelated merges;
# it should open a dashboard finding we triage on its own cadence.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      # audit-check opens an issue per advisory on scheduled runs.
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-npm:
    name: npm advisories (e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: tests/e2e
